<svg xmlns='http://www.w3.org/2000/svg' width='820' height='520' viewBox='0 0 820 520'>
  <defs>
    <linearGradient id='turnGradient' x1='0%' x2='100%' y1='0%' y2='0%'>
      <stop offset='0%' stop-color='#f7fbff' />
      <stop offset='25%' stop-color='#cfe8ff' />
      <stop offset='50%' stop-color='#7bb6ff' />
      <stop offset='75%' stop-color='#2d7ff9' />
      <stop offset='100%' stop-color='#0a3d9c' />
    </linearGradient>
  </defs>

  <rect width='820' height='520' fill='white'/>
  <text x='410' y='28' text-anchor='middle' font-size='18' font-weight='bold'>PB600 Steering Deadband Heatmap</text>

  <g transform='translate(70,52)'>
    <rect x='0' y='0' width='620' height='380' fill='#f6f8fb' stroke='black' stroke-width='1.2' />

    <!-- Axes -->
    <line x1='60' y1='330' x2='600' y2='330' stroke='black' stroke-width='1.2' />
    <line x1='60' y1='20' x2='60' y2='330' stroke='black' stroke-width='1.2' />

    <!-- Ticks -->
    <g font-size='11' fill='black'>
      <line x1='60' y1='330' x2='60' y2='336' stroke='black' />
      <line x1='180' y1='330' x2='180' y2='336' stroke='black' />
      <line x1='300' y1='330' x2='300' y2='336' stroke='black' />
      <line x1='420' y1='330' x2='420' y2='336' stroke='black' />
      <line x1='540' y1='330' x2='540' y2='336' stroke='black' />

      <line x1='60' y1='330' x2='54' y2='330' stroke='black' />
      <line x1='60' y1='255' x2='54' y2='255' stroke='black' />
      <line x1='60' y1='180' x2='54' y2='180' stroke='black' />
      <line x1='60' y1='105' x2='54' y2='105' stroke='black' />
      <line x1='60' y1='30' x2='54' y2='30' stroke='black' />

      <text x='60' y='352' text-anchor='middle'>0.0</text>
      <text x='180' y='352' text-anchor='middle'>0.2</text>
      <text x='300' y='352' text-anchor='middle'>0.4</text>
      <text x='420' y='352' text-anchor='middle'>0.6</text>
      <text x='540' y='352' text-anchor='middle'>1.0</text>

      <text x='32' y='334' text-anchor='end'>0%</text>
      <text x='32' y='259' text-anchor='end'>25%</text>
      <text x='32' y='184' text-anchor='end'>50%</text>
      <text x='32' y='109' text-anchor='end'>75%</text>
      <text x='32' y='34' text-anchor='end'>100%</text>
    </g>

    <!-- Labels -->
    <text x='330' y='390' text-anchor='middle' font-size='13'>Rudder input</text>
    <text x='18' y='175' transform='rotate(-90 18 175)' text-anchor='middle' font-size='13'>Throttle</text>

    <!-- Linear throttle-dependent deadband: -->
    <!-- deadband(throttle) = 0.02 + (0.10 - 0.02) * throttle -->
    <!-- Low throttle rows are almost fully active; high throttle rows are active only to the right of the widened deadband. -->
    <g>
      <!-- 0% throttle row (bottom): nearly full row active -->
      <rect x='60' y='300' width='515' height='30' fill='url(#turnGradient)' fill-opacity='0.92' />
      <rect x='60' y='300' width='28' height='30' fill='url(#turnGradient)' fill-opacity='0.08' />

      <!-- 25% throttle row -->
      <rect x='60' y='255' width='495' height='45' fill='url(#turnGradient)' fill-opacity='0.82' />
      <rect x='60' y='255' width='48' height='45' fill='url(#turnGradient)' fill-opacity='0.08' />

      <!-- 50% throttle row -->
      <rect x='60' y='180' width='470' height='45' fill='url(#turnGradient)' fill-opacity='0.68' />
      <rect x='60' y='180' width='78' height='45' fill='url(#turnGradient)' fill-opacity='0.08' />

      <!-- 75% throttle row -->
      <rect x='60' y='105' width='425' height='45' fill='url(#turnGradient)' fill-opacity='0.52' />
      <rect x='60' y='105' width='130' height='45' fill='url(#turnGradient)' fill-opacity='0.08' />

      <!-- 100% throttle row (top): only the right side remains active -->
      <rect x='60' y='30' width='355' height='45' fill='url(#turnGradient)' fill-opacity='0.35' />
      <rect x='60' y='30' width='112' height='45' fill='url(#turnGradient)' fill-opacity='0.08' />
    </g>

    <!-- Deadband threshold markers for the linear curve -->
    <g stroke='gray' stroke-dasharray='3 4' opacity='0.8' fill='gray' font-size='10'>
      <line x1='70' y1='300' x2='70' y2='330' />
      <line x1='90' y1='255' x2='90' y2='300' />
      <line x1='120' y1='180' x2='120' y2='225' />
      <line x1='170' y1='105' x2='170' y2='150' />
      <line x1='250' y1='30' x2='250' y2='75' />

      <text x='74' y='294'>0.02</text>
      <text x='94' y='249'>0.04</text>
      <text x='124' y='174'>0.06</text>
      <text x='174' y='99'>0.08</text>
      <text x='254' y='24'>0.10</text>
    </g>

    <!-- legend -->
    <g transform='translate(430, 18)'>
      <rect x='0' y='0' width='150' height='72' fill='white' stroke='black' stroke-width='1' />
      <text x='12' y='18' font-size='11' font-weight='bold'>Turn</text>
      <rect x='12' y='26' width='110' height='12' fill='url(#turnGradient)' />
      <text x='12' y='58' font-size='10'>0</text>
      <text x='108' y='58' font-size='10' text-anchor='end'>max</text>
    </g>
  </g>
</svg>
