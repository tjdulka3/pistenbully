<svg xmlns='http://www.w3.org/2000/svg' width='980' height='620' viewBox='0 0 980 620'>
  <defs>
    <linearGradient id='turnScale' x1='0%' x2='100%' y1='0%' y2='0%'>
      <stop offset='0%' stop-color='#f7fbff'/>
      <stop offset='15%' stop-color='#dfeeff'/>
      <stop offset='35%' stop-color='#bddcff'/>
      <stop offset='55%' stop-color='#7eb7ff'/>
      <stop offset='75%' stop-color='#2d7ff9'/>
      <stop offset='100%' stop-color='#0c2c7a'/>
    </linearGradient>
    <filter id='softShadow' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='1.5' stdDeviation='2' flood-color='#000000' flood-opacity='0.12'/>
    </filter>
  </defs>

  <rect width='980' height='620' fill='#fafbfd'/>
  <text x='490' y='38' text-anchor='middle' font-size='21' font-weight='700' fill='#1f2d3d'>PB600 Steering Deadband Mapping</text>

  <g transform='translate(90,70)' filter='url(#softShadow)'>
    <rect x='0' y='0' width='760' height='460' rx='10' fill='white' stroke='#dfe6ef' stroke-width='1.2'/>

    <!-- Plot area -->
    <g>
      <rect x='80' y='40' width='620' height='350' fill='#f8fbff' stroke='#d6dde8' stroke-width='1'/>

      <!-- Grid -->
      <g stroke='#e1e8f0' stroke-width='1'>
        <line x1='80' y1='100' x2='700' y2='100'/>
        <line x1='80' y1='160' x2='700' y2='160'/>
        <line x1='80' y1='220' x2='700' y2='220'/>
        <line x1='80' y1='280' x2='700' y2='280'/>
        <line x1='80' y1='340' x2='700' y2='340'/>

        <line x1='170' y1='40' x2='170' y2='390'/>
        <line x1='260' y1='40' x2='260' y2='390'/>
        <line x1='350' y1='40' x2='350' y2='390'/>
        <line x1='440' y1='40' x2='440' y2='390'/>
        <line x1='530' y1='40' x2='530' y2='390'/>
        <line x1='620' y1='40' x2='620' y2='390'/>
      </g>

      <!-- Linear deadband: low throttle rows are almost fully active, high throttle rows only become active after the widened threshold -->
      <g opacity='0.95'>
        <rect x='80' y='330' width='25' height='60' fill='#dfe7f0' fill-opacity='0.9'/>
        <rect x='80' y='270' width='55' height='60' fill='#dfe7f0' fill-opacity='0.9'/>
        <rect x='80' y='210' width='90' height='60' fill='#dfe7f0' fill-opacity='0.9'/>
        <rect x='80' y='150' width='135' height='60' fill='#dfe7f0' fill-opacity='0.92'/>
        <rect x='80' y='90' width='200' height='60' fill='#dfe7f0' fill-opacity='0.95'/>
      </g>

      <!-- Heatmap intensity -->
      <g>
        <rect x='80' y='330' width='620' height='60' fill='url(#turnScale)' opacity='0.98'/>
        <rect x='80' y='270' width='620' height='60' fill='url(#turnScale)' opacity='0.85'/>
        <rect x='80' y='210' width='620' height='60' fill='url(#turnScale)' opacity='0.72'/>
        <rect x='80' y='150' width='620' height='60' fill='url(#turnScale)' opacity='0.56'/>
        <rect x='80' y='90' width='620' height='60' fill='url(#turnScale)' opacity='0.38'/>
      </g>

      <!-- Threshold lines -->
      <g stroke='#56677a' stroke-width='1.5' stroke-dasharray='5 5' opacity='0.9'>
        <line x1='105' y1='330' x2='105' y2='390'/>
        <line x1='135' y1='270' x2='135' y2='330'/>
        <line x1='170' y1='210' x2='170' y2='270'/>
        <line x1='215' y1='150' x2='215' y2='210'/>
        <line x1='280' y1='90' x2='280' y2='150'/>
      </g>

      <!-- Axis labels -->
      <g font-size='11' fill='#334156'>
        <text x='270' y='430' text-anchor='middle'>Rudder input</text>
        <text x='24' y='220' transform='rotate(-90 24 220)' text-anchor='middle'>Throttle</text>

        <text x='80' y='415' text-anchor='middle'>0.0</text>
        <text x='170' y='415' text-anchor='middle'>0.2</text>
        <text x='260' y='415' text-anchor='middle'>0.4</text>
        <text x='350' y='415' text-anchor='middle'>0.6</text>
        <text x='440' y='415' text-anchor='middle'>0.8</text>
        <text x='530' y='415' text-anchor='middle'>1.0</text>

        <text x='58' y='390' text-anchor='end'>0%</text>
        <text x='58' y='330' text-anchor='end'>25%</text>
        <text x='58' y='270' text-anchor='end'>50%</text>
        <text x='58' y='210' text-anchor='end'>75%</text>
        <text x='58' y='150' text-anchor='end'>100%</text>
      </g>

      <!-- Threshold annotations -->
      <g font-size='10' fill='#334156'>
        <text x='109' y='330' text-anchor='start'>0.02</text>
        <text x='139' y='270' text-anchor='start'>0.04</text>
        <text x='174' y='210' text-anchor='start'>0.06</text>
        <text x='219' y='150' text-anchor='start'>0.08</text>
        <text x='284' y='90' text-anchor='start'>0.10</text>
      </g>
    </g>

    <!-- Legend -->
    <g transform='translate(545, 20)'>
      <rect x='0' y='0' width='170' height='78' rx='8' fill='white' stroke='#dfe6ef' stroke-width='1' />
      <text x='14' y='22' font-size='12' font-weight='700' fill='#1f2d3d'>Turn contribution</text>
      <rect x='14' y='32' width='130' height='14' fill='url(#turnScale)' rx='4'/>
      <text x='14' y='62' font-size='10' fill='#334156'>0</text>
      <text x='144' y='62' font-size='10' text-anchor='end' fill='#334156'>max</text>
    </g>
  </g>
</svg>
